<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: red;
        }

        .login-box {
            background: white;
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 90%;
        }

        button {
            padding: 10px;
            width: 95%;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Login</h1>

    <p><b>Nama:</b> NAMA KAMU</p>
    <p><b>NPM:</b> NPM KAMU</p>
    <p><b>Kelas:</b> KELAS KAMU</p>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <br><br>

    <button>Login</button>

</div>

</body>
</html>
